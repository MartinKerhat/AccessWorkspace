name: Release launcher

# Publishes the desktop launcher when its compiled version changes on main
# (launcher/internal/launcherinfo/launcherinfo.go, `Version = "x.y.z"`).
# Builds Windows (.exe), Linux (.tar.gz) and macOS (.dmg) builds and attaches them to a
# GitHub Release tagged launcher-v<version> — a neutral distribution point.
# Deployments running ARTIFACTS_SOURCE=github serve the new build
# automatically; nothing is ever pushed into a deployment from here.
#
# A push that touches launcher/** without bumping the version publishes nothing,
# because that version is already released. The check asks the release list, so
# it does not matter which commit of a push carries the bump. Use
# workflow_dispatch with force=true to rebuild and re-upload an existing version.
#
# Local fallback: launcher/build.ps1 (Windows + Linux) and
# launcher/scripts/build_macos.sh (macOS, needs a Mac); both write into
# artifacts/launcher/.

on:
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - ".github/workflows/release-launcher.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if the launcher version did not change in this push"
        type: boolean
        default: false

permissions:
  contents: write # create the launcher-v* release and upload assets

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and whether to release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_file="launcher/internal/launcherinfo/launcherinfo.go"
          version="$(grep -oP 'Version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' "$version_file")"
          # Release when this version has NOT been published yet — not when it
          # changed in the last commit. The old HEAD~1 comparison silently
          # published nothing whenever a push's final commit did not itself carry
          # the bump (e.g. bump in commit A, more work in commit B, pushed
          # together: the run sees A as "previous" and calls it unchanged).
          # Asking the release list is also idempotent, so re-runs are harmless.
          release=false
          if gh release view "launcher-v${version}" >/dev/null 2>&1; then
            echo "launcher-v${version} is already published — nothing to do."
          else
            release=true
          fi
          if [ "${{ inputs.force || false }}" = "true" ]; then
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version release=$release"

  release:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod

      - name: Build Windows launcher
        run: |
          set -euo pipefail
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build \
            -ldflags="-H=windowsgui" \
            -o "access-workspace-launcher-windows-amd64-v${VERSION}.exe" \
            ./cmd/access-workspace-launcher

      - name: Build Linux launcher tarball
        run: |
          set -euo pipefail
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -o access-workspace-launcher \
            ./cmd/access-workspace-launcher
          go run ./scripts/package_linux_tar.go \
            -binary access-workspace-launcher \
            -name access-workspace-launcher \
            -out "access-workspace-launcher-linux-amd64-v${VERSION}.tar.gz"
          rm access-workspace-launcher

      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="launcher-v${VERSION}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Launcher ${VERSION}" \
              --notes "Desktop launcher ${VERSION} (Windows, Linux, macOS). Deployments running ARTIFACTS_SOURCE=github serve these files automatically."
          fi
          gh release upload "$tag" \
            "access-workspace-launcher-windows-amd64-v${VERSION}.exe" \
            "access-workspace-launcher-linux-amd64-v${VERSION}.tar.gz" \
            --clobber
          echo "Release $tag updated."

      # Retention: keep the newest RETAIN launcher releases (by version) and
      # remove the rest, tags included. The app only ever offers the newest
      # build per platform and refuses older launchers at connection time, so
      # old releases serve one purpose: rolling back a bad release by removing
      # it, which makes the previous one the requirement again. Three versions
      # is a comfortable window for that. The release just published is never
      # removed, even when `force` rebuilt an old version.
      - name: Prune old launcher releases
        env:
          GH_TOKEN: ${{ github.token }}
          RETAIN: "3"
        run: |
          set -euo pipefail
          current="launcher-v${VERSION}"
          mapfile -t tags < <(
            gh release list --limit 200 --json tagName --jq '.[].tagName' \
              | grep -E '^launcher-v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -t v -k 2 -V -r
          )
          echo "Launcher releases (newest first): ${tags[*]}"
          if [ "${#tags[@]}" -le "$RETAIN" ]; then
            echo "Nothing to prune (keeping up to $RETAIN)."
            exit 0
          fi
          for tag in "${tags[@]:$RETAIN}"; do
            if [ "$tag" = "$current" ]; then
              echo "Keeping $tag (just published)."
              continue
            fi
            echo "Pruning $tag and its tag."
            gh release delete "$tag" --cleanup-tag --yes
          done

  # macOS needs a Mac to build (cgo + Cocoa, plus the bundled FreeRDP client)
  # and Apple's signing and notarization, so it runs on its own runner after
  # the release exists and adds its .dmg to it. Without the Apple secrets the
  # job skips with a warning instead of failing, so Windows and Linux releases
  # never wait on it. Secrets: APPLE_DEVELOPER_ID_P12 (base64 of the
  # "Developer ID Application" certificate export), APPLE_DEVELOPER_ID_P12_PASSWORD,
  # and an App Store Connect API key for notarization: APPLE_API_KEY_ID,
  # APPLE_API_ISSUER_ID, APPLE_API_KEY_P8 (the .p8 file's text).
  release-macos:
    needs: [version, release]
    if: needs.version.outputs.release == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Check Apple signing secrets
        id: apple
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        working-directory: .
        run: |
          if [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] && [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER_ID" ] && [ -n "$API_KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Apple signing secrets are not configured; launcher ${VERSION} ships without a macOS build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.apple.outputs.ready == 'true'

      - uses: actions/setup-go@v5
        if: steps.apple.outputs.ready == 'true'
        with:
          go-version-file: launcher/go.mod

      # The RDP client bundled into the .app (FreeRDP + OpenSSL, both
      # architectures) takes a while to compile; its build script pins the
      # versions, so the output is cached on that script's content.
      - name: Cache the bundled FreeRDP client
        if: steps.apple.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: artifacts/launcher/mac-deps
          key: macfreerdp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('launcher/scripts/build_freerdp_macos.sh') }}

      - name: Build the bundled FreeRDP client
        if: steps.apple.outputs.ready == 'true'
        run: bash scripts/build_freerdp_macos.sh "$GITHUB_WORKSPACE/artifacts/launcher/mac-deps"

      - name: Import Developer ID certificate
        if: steps.apple.outputs.ready == 'true'
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -n 1 | tr -d '"')"
          if [ -z "$identity" ]; then
            echo "No Developer ID Application identity in the imported certificate." >&2
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        if: steps.apple.outputs.ready == 'true'
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          printf '%s\n' "$API_KEY_P8" > "$NOTARY_KEY_PATH"
          bash scripts/build_macos.sh "$RUNNER_TEMP/out"
          rm "$NOTARY_KEY_PATH"

      - name: Add the macOS build to the release
        if: steps.apple.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "launcher-v${VERSION}" \
            "$RUNNER_TEMP/out/access-workspace-launcher-macos-universal-v${VERSION}.dmg" \
            --clobber

      - name: Remove signing keychain
        if: always() && steps.apple.outputs.ready == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
